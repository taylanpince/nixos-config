# Solarized Light (readable, distinct palette)
# Accents (color1-6,9,13) match dark mode on purpose — Solarized shares them.
# Monotone slots are inverted vs dark so text stays dark/readable on the light
# background and the theme visibly differs from dark inside 16-color apps.
background            #fdf6e3
foreground            #586e75
selection_background   #eee8d5
selection_foreground   #002b36
cursor                #586e75
cursor_text_color     #fdf6e3

# normal
color0   #073642
color1   #dc322f
color2   #859900
color3   #b58900
color4   #268bd2
color5   #d33682
color6   #2aa198
color7   #586e75
