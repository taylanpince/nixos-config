font_family      JetBrainsMono Nerd Font
font_size        24.0
disable_ligatures never
window_padding_width 6
window_padding_width_left 12

# Theme (swapped by ~/.config/waybar/scripts/theme.sh; symlink -> theme-{dark,light}.conf)
include theme.conf

tab_bar_edge top
tab_bar_style powerline
active_tab_font_style bold
inactive_tab_font_style normal

# Next/prev tab with Ctrl+Shift+[ and ]
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

# New tab opens in current directory
map ctrl+shift+t new_tab_with_cwd

# Ctrl+C: copy if there's a selection, otherwise send SIGINT
map ctrl+c copy_or_interrupt

# Ctrl+V: paste from clipboard
map ctrl+v paste_from_clipboard

# Plain left-click opens URLs (no Ctrl+Shift needed)
mouse_map left click ungrabbed mouse_click_url_or_select

# Shift+Enter inserts a newline in Claude Code (and other TUIs that treat
# ESC+CR as a soft newline). Works through tmux because it doesn't rely on
# the CSI-u extended-keys protocol.
map shift+enter send_text all \x1b\r
