source=~/.config/hypr/mocha.conf

$mod = SUPER

# Laptop display, fixed to the LEFT of the LG's two tiles, at the origin (x 0-2879).
# Fixed, not auto-left: explicit positions keep the layout stable at boot no
# matter which output is placed first. When the LG is absent the laptop is
# simply the sole display at the origin.
monitor=eDP-1,2880x1920@120,0x0,1

# External LG UltraFine 5K (27MD5KL), Thunderbolt 3.
# Driven as two 2560x2880 SST tiles side by side = native 5120x2880 @ 60.
# Needs a TB-certified cable with a PD 3.0 e-marker; the bundled LG TB3 cable
# fails to enumerate on this laptop. Connector names (DP-7 left, DP-8 right)
# can shift if the port or enumeration order changes; both tiles share one
# EDID description, so they can only be told apart by connector name.
# Main display when connected, to the right of the laptop (eDP-1 above):
# left tile at x=2880, right tile beside it at x=5440.
monitor=DP-7,2560x2880@60,2880x0,1
monitor=DP-8,2560x2880@60,5440x0,1

# Workspaces are pinned per screen so the layout survives a reboot and there is
# always an empty page to grow into. The LG shows four persistent "pages": the
# left tile (DP-7) holds the odd workspaces, the right tile (DP-8) the even ones,
# and Super+Left/Right (lg-paired-workspace.sh) steps both tiles a page at a time.
# The LG is the default surface, so new windows open on the big screen.
workspace = 1, monitor:DP-7, default:true, persistent:true
workspace = 3, monitor:DP-7, persistent:true
workspace = 5, monitor:DP-7, persistent:true
workspace = 7, monitor:DP-7, persistent:true
workspace = 2, monitor:DP-8, persistent:true
workspace = 4, monitor:DP-8, persistent:true
workspace = 6, monitor:DP-8, persistent:true
workspace = 8, monitor:DP-8, persistent:true

# The laptop keeps its own range (9-11) so its numbers never collide with the
# LG pages; Super+Left/Right there cycles these with empties always available.
workspace = 9, monitor:eDP-1, default:true, persistent:true
workspace = 10, monitor:eDP-1, persistent:true
workspace = 11, monitor:eDP-1, persistent:true

# Start essentials
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_DESKTOP
exec-once = /run/current-system/sw/bin/swaync
exec-once = systemctl --user restart waybar.service
exec-once = hyprpaper
exec-once = hypridle
exec-once = ~/.config/scripts/set-random-wallpaper.sh
exec-once = ~/.config/scripts/wallpaper-hotplug.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = ~/.config/scripts/start-wob.sh
exec-once = flatpak run com.todoist.Todoist
exec-once = localsend_app --hidden

# Todoist scratchpad
windowrule {
  name = todoist-scratchpad
  match:class = ^(Todoist)$
  workspace = special:todoist silent
  float = on
  size = 1500 1200
  center = on
}

# Make wob fade (no slide)
layerrule = no_anim on, match:namespace wob

# Kitty: slight transparency + blur
windowrule {
  name = kitty-opacity
  match:class = ^(kitty)$
  opacity = 0.92 0.92
}

# kitty scratchpad window rules
windowrule {
  name = kitty-scratchpad
  match:class = ^(kitty-scratchpad)$
  workspace = special:scratchpad
  float = on
  fullscreen = on
}
animation = specialWorkspace, 1, 3, default, slidevert

# showmethekeys window
windowrule {
  name = showmethekeys
  match:class = ^(showmethekey-gtk)$
  float = on
  pin = on
  border_size = 0
  no_focus = on
  move = 20 20
  size = 700 120
}

# Gnome scratchpad
windowrule {
  name = scratchpad-text-editor

  match:class = ^(org\.gnome\.TextEditor)$

  float = on
  center = on
  size = 1500 1200
  workspace = special:notes silent
}

# Chromium/Brave screen-share indicator (Google Meet etc.)
$shareIndicator = ^(.*)(is sharing (your screen|a window).*)$

windowrule {
  name = share-indicator
  match:title = $shareIndicator
  no_focus = on
  no_initial_focus = on
  workspace = special:share silent
}

$meetPip = ^Meet - .+$
windowrule {
  name = meet-pip
  match:title = $meetPip
  float = on
  pin = on
  size = 300 523
  move = 2240 40   # adjust for your monitor
}

# Blur swaync layers (and ignore transparent pixels so you don’t blur the whole screen)
layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-notification-window)$

# wofi layer rules
layerrule = blur off, match:namespace ^(wofi)$
layerrule = no_anim on, match:namespace ^(wofi)$

cursor {
  enable_hyprcursor = false
  hide_on_key_press = true
}

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,36

# Font/UI scaling without resolution change
env = GDK_DPI_SCALE,1.5
env = QT_SCALE_FACTOR,1.5

# Input
input {
  kb_layout = us
  follow_mouse = 1
  natural_scroll = true
  kb_options = altwin:swap_lalt_lwin
}

# Layout / visuals (keep it simple)
general {
  gaps_in = 4
  gaps_out = 8
  border_size = 3
  layout = dwindle

  col.active_border = $mauve $flamingo 90deg
  col.inactive_border = $subtext0

  resize_on_border = true
}

decoration {
  rounding = 4

  blur {
    enabled = true
    size = 6
    passes = 2
    new_optimizations = true
    ignore_opacity = false
  }
}

animations {
  enabled = true

  bezier = easeOut, 0.16, 1, 0.3, 1
  animation = borderangle, 1, 50, linear, loop

  animation=workspaces,1,0.5,default
  animation=windows,0,0.1,default
  animation=fade,0,0.1,default
}

dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  preserve_split = yes # you probably want this
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  focus_on_activate = true
}

# Workspace assignments
windowrule {
  name = workspace-brave
  match:class = ^(brave-browser)$
  workspace = 2
}

# Keybinds
bind = $mod, RETURN, exec, kitty
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exec, wlogout --protocol layer-shell
bind = $mod SHIFT, T, exec, ~/.config/waybar/scripts/theme.sh --toggle

# Focus movement (hjkl)
bind = ALT SHIFT, left, movefocus, l
bind = ALT SHIFT, down, movefocus, d
bind = ALT SHIFT, up, movefocus, u
bind = ALT SHIFT, right, movefocus, r

# Swap windows
# Step the focused window across screens: laptop <-> right tile <-> left tile.
# movewindow mon:l/r moves it to the monitor in that direction and focus follows,
# so repeating the key keeps walking it along the row.
bind = CTRL SHIFT ALT, left, movewindow, mon:l
bind = CTRL SHIFT ALT, right, movewindow, mon:r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, left,  movetoworkspace, r-1
bind = $mod SHIFT, right, movetoworkspace, r+1
# Option 3 trial: Super+Left/Right flips BOTH LG tiles together (and just the
# focused screen when you're on the laptop). Revert to the two lines below to
# go back to per-screen relative switching:
#   bind = $mod, left, workspace, r-1
#   bind = $mod, right, workspace, r+1
bind = $mod, left,  exec, ~/.config/scripts/lg-paired-workspace.sh prev
bind = $mod, right, exec, ~/.config/scripts/lg-paired-workspace.sh next

# Resize active window (Ctrl+Alt + arrows)
bind = CTRL ALT, left,  resizeactive, -40 0
bind = CTRL ALT, right, resizeactive,  40 0
bind = CTRL ALT, up,    resizeactive,  0 -40
bind = CTRL ALT, down,  resizeactive,  0  40

# Window switcher
bind = $mod, TAB, exec, ~/.config/scripts/window-switcher.sh
bind = CTRL, SPACE, exec, wofi --show drun --style ~/.config/wofi/style.css
#bind = $mod, TAB, cyclenext, hist
#bind = $mod SHIFT, TAB, cyclenext, prev hist
bind = $mod, GRAVE, focuscurrentorlast

# Floating windows
bind = $mod, F, togglefloating
bind = $mod, F, centerwindow
bind = $mod SHIFT, F, fullscreen
bind = $mod CTRL, E, exec, ~/.config/scripts/toggle-terminal.sh

# Display switcher
# The LG's left tile (DP-7) is the primary external target.
bind = $mod CTRL SHIFT, right, exec, hyprctl --batch "dispatch movewindow mon:DP-7; dispatch focusmonitor DP-7"
bind = $mod CTRL SHIFT, left,  exec, hyprctl --batch "dispatch movewindow mon:eDP-1; dispatch focusmonitor eDP-1"
bind = $mod CTRL SHIFT, C, movecurrentworkspacetomonitor, DP-7
bind = $mod CTRL SHIFT, Z,  movecurrentworkspacetomonitor, eDP-1
bind = $mod CTRL SHIFT, X, swapactiveworkspaces, eDP-1 DP-7
# LG on but blank after hotplug: nudge the tiles (DPMS cycle) and log the use.
# Three modifiers so it can't be hit by accident; sits with the display ops above.
bind = $mod CTRL SHIFT, P, exec, ~/.config/scripts/lg-dpms-cycle.sh

# Clipboard history
bind = CTRL ALT, V, exec, ~/.config/scripts/clipboard-history.sh

# Screenshot (grim+slurp)
bind = $mod SHIFT, 4, exec, grim -g "$(slurp)" - | satty -f -
bind = $mod SHIFT, 5, exec, ~/.config/scripts/record-screen.sh
bind = $mod SHIFT, 6, exec, ~/.config/scripts/record-screen.sh audio

# F keys
# Volume
bind = , XF86AudioRaiseVolume, exec, ~/.config/scripts/osd-volume.sh up
bind = , XF86AudioLowerVolume, exec, ~/.config/scripts/osd-volume.sh down
bind = , XF86AudioMute,        exec, ~/.config/scripts/osd-volume.sh mute

# Brightness
bind = , XF86MonBrightnessUp,   exec, ~/.config/scripts/osd-brightness.sh raise
bind = , XF86MonBrightnessDown, exec, ~/.config/scripts/osd-brightness.sh lower

# yazi in a terminal at ~
bind = $mod, N, exec, kitty -e yazi ~

# nemo (GUI file manager) at ~
bind = $mod SHIFT, N, exec, nemo ~

# aichat global prompt
bind = CTRL SHIFT, I, exec, ~/.config/scripts/ai-cmd-generator.sh

# sway notifications dnd
bind = CTRL SHIFT, D, exec, swaync-client -d

# Todoist
bind = $mod CTRL, T, togglespecialworkspace, todoist

# Gnome Scratchpad
bind = $mod CTRL, R, exec, ~/.config/scripts/scratchpad-text.sh

# Voxtype dictation: tap SUPER+C to start, tap again to stop and transcribe.
# (Moved from ALT+C, which also fired the external keyboard's dedicated mic
# key — that key isn't used, so SUPER+C is the primary trigger now.)
bind = $mod, C, exec, voxtype record toggle

# Meeting recorder: toggle capture of the default sink monitor + mic mixed
# into ~/Documents/transcripts/*.wav, then transcribes with whisper-cli
# (medium model, background). Waybar's custom/meeting-record indicator
# mirrors voxtype's — red while recording, yellow while transcribing.
bind = SUPER ALT, C, exec, ~/.config/scripts/meeting-record.sh toggle

